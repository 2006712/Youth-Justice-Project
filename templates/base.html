<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Youth Justice Project</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        .navbar {
            background: #1e3a8a;
            color: white;
            padding: 14px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }

        .navbar h1 {
            font-size: 22px;
            font-weight: 700;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .logout-link {
            background: none;
            border: none;
            color: white;
            margin-left: 20px;
            font-size: 15px;
            cursor: pointer;
        }

        .logout-link:hover {
            text-decoration: underline;
        }

        .page-wrapper {
            max-width: 1100px;
            margin: 24px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
            border: 1px solid #e5e7eb;
        }

        .auth-card {
            max-width: 430px;
            margin: 24px auto;
            padding: 26px 30px;
        }

        h2 {
            margin-bottom: 8px;
            color: #111827;
            font-size: 26px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 20px;
            line-height: 1.4;
            font-size: 15px;
        }

        form p {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #374151;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .helptext {
            display: block;
            margin-top: 5px;
            color: #6b7280;
            font-size: 12px;
            line-height: 1.3;
        }

        ul {
            margin-left: 18px;
            margin-top: 5px;
            margin-bottom: 8px;
            color: #6b7280;
            font-size: 12px;
            line-height: 1.35;
        }

        li {
            margin-bottom: 3px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            background: #2563eb;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: 0.2s;
            margin-top: 4px;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #374151;
        }

        .btn-secondary:hover {
            background: #1f2937;
        }

        .auth-footer {
            margin-top: 16px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }

        .auth-footer a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .error-box {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 18px;
            margin-top: 24px;
        }

        .dashboard-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 22px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 5px 16px rgba(15, 23, 42, 0.06);
        }

        .dashboard-card h3 {
            margin-bottom: 10px;
            color: #1e3a8a;
            font-size: 18px;
        }

        .dashboard-card p {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 14px;
        }

        .dashboard-card a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }

        .dashboard-card a:hover {
            text-decoration: underline;
        }

        .user-badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 14px;
            margin-top: 6px;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            padding: 14px;
            color: #6b7280;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 14px 20px;
                flex-direction: column;
                gap: 10px;
            }

            .navbar a,
            .logout-link {
                margin-left: 10px;
            }

            .auth-card {
                margin: 18px auto;
                padding: 22px;
            }

            .page-wrapper {
                margin: 18px auto;
            }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>Youth Justice Project</h1>

        <div>
            <a href="/">Home</a>

            {% if user.is_authenticated %}
                <a href="{% url 'accounts:dashboard' %}">Dashboard</a>

                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="logout-link">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'accounts:register' %}">Register</a>
            {% endif %}
        </div>
    </div>

    <main class="page-wrapper">
        {% block content %}
        {% endblock %}
    </main>

    <div class="footer">
        Youth Justice Project | Assessment 4 Django Application
    </div>

</body>
</html>
